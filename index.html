<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="form-header">
            <h1>Student Registration Portal</h1>
            <p>Please fill out the form accurately to complete your registration.</p>
        </header>

        <form action="#" method="POST" enctype="multipart/form-data" class="registration-form">
            
            <!-- Personal Information Section -->
            <fieldset>
                <legend>Personal Information</legend>

                <div class="form-group">
                    <label for="fullname">Full Name <span class="required">*</span></label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number <span class="required">*</span></label>
                        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">Date of Birth <span class="required">*</span></label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label>Gender <span class="required">*</span></label>
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="male" required> Male</label>
                            <label><input type="radio" name="gender" value="female"> Female</label>
                            <label><input type="radio" name="gender" value="other"> Other</label>
                        </div>
                    </div>
                </div>
            </fieldset>

            <!-- Address & Location Section -->
            <fieldset>
                <legend>Address Details</legend>

                <div class="form-group">
                    <label for="address">Address <span class="required">*</span></label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter street address, apartment, etc." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City <span class="required">*</span></label>
                        <input type="text" id="city" name="city" placeholder="Enter city" required>
                    </div>

                    <div class="form-group">
                        <label for="state">State <span class="required">*</span></label>
                        <input type="text" id="state" name="state" placeholder="Enter state" required>
                    </div>

                    <div class="form-group">
                        <label for="pincode">PIN Code <span class="required">*</span></label>
                        <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" placeholder="6-digit PIN" required>
                    </div>
                </div>
            </fieldset>

            <!-- Academic & Skills Section -->
            <fieldset>
                <legend>Academic & Professional Profile</legend>

                <div class="form-group">
                    <label for="course">Course Selection <span class="required">*</span></label>
                    <select id="course" name="course" required>
                        <option value="" disabled selected>-- Select a Course --</option>
                        <option value="fullstack">Full Stack Web Development</option>
                        <option value="datascience">Data Science & Analytics</option>
                        <option value="aiml">Artificial Intelligence & Machine Learning</option>
                        <option value="cybersecurity">Cyber Security</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Skills <span class="required">*</span></label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="skills" value="html"> HTML5 / CSS3</label>
                        <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
                        <label><input type="checkbox" name="skills" value="python"> Python</label>
                        <label><input type="checkbox" name="skills" value="sql"> SQL / Databases</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="resume">Upload Resume (PDF / DOCX) <span class="required">*</span></label>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
                </div>
            </fieldset>

            <!-- Security Section -->
            <fieldset>
                <legend>Account Security</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <input type="password" id="password" name="password" minlength="8" placeholder="At least 8 characters" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password <span class="required">*</span></label>
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter password" required>
                    </div>
                </div>
            </fieldset>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="reset" class="btn btn-secondary">Reset</button>
                <button type="submit" class="btn btn-primary">Submit Registration</button>
            </div>

        </form>
    </main>

</body>
</html>
